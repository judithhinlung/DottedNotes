[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dottednotes"
version = "0.1.0"
description = "Braille music to LilyPond converter"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
dependencies = [
    "music21>=8.3.0",
    "fastapi",
    "uvicorn",
    "python-multipart",
]

[project.scripts]
dottednotes = "dottednotes.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    # starlette.testclient (via fastapi.testclient, used in test_web.py)
    # requires httpx on starlette<0.50 (the last version supporting Python
    # 3.9) and httpx2 on starlette>=0.50 (which requires Python >=3.10) --
    # neither package alone installs cleanly across our full 3.9-3.11
    # support matrix, so both are pulled in behind version markers.
    "httpx; python_version < \"3.10\"",
    "httpx2; python_version >= \"3.10\"",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dottednotes = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]